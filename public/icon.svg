<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <g stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Right Hemisphere (Pink lobes) -->
    <path fill="#FF85A1" d="
      M 256, 16
      C 300, 16 350, 40 375, 75
      C 410, 60 455, 90 465, 135
      C 485, 180 470, 230 445, 260
      C 480, 290 490, 345 470, 390
      C 445, 440 395, 470 340, 465
      C 295, 460 270, 440 256, 420
      Z" />

    <!-- Right Hemisphere Internal Brain Fissure/Fold Line -->
    <path fill="none" d="M 375, 205 C 320, 215 320, 285 385, 280" />

    <!-- Left Hemisphere (Pink lower lobes with top-left jagged electric break) -->
    <path fill="#FF85A1" d="
      M 256, 420
      C 240, 440 215, 460 170, 465
      C 115, 470 65, 440 40, 390
      C 20, 345 30, 290 65, 260
      C 45, 235 50, 200 75, 175
      L 120, 195
      L 100, 145
      L 155, 165
      L 135, 115
      L 190, 135
      L 170, 85
      L 220, 105
      L 210, 55
      L 256, 16
      Z" />

    <!-- Central Divider Line -->
    <line x1="256" y1="16" x2="256" y2="420" />

    <!-- Top Left Small Lightning Bolt -->
    <polygon fill="#FFD600" points="
      180,15
      115,15
      160,65
      120,65
      195,125
      160,80
      200,80" />

    <!-- Middle Left Large Lightning Bolt -->
    <polygon fill="#FFD600" points="
      120,135
      10,135
      85,190
      30,190
      145,275
      95,210
      150,210" />

    <!-- Plus Symbol Top-Left -->
    <path fill="none" d="M 65, 45 V 85 M 45, 65 H 85" stroke-width="16" />

    <!-- Cyan Accent Circle Left -->
    <circle cx="48" cy="245" r="16" fill="#00F5D4" />

    <!-- Cyan Accent Circle Inner Left -->
    <circle cx="235" cy="265" r="16" fill="#00F5D4" />

    <!-- White Specular Highlight Dots -->
    <rect x="125" y="260" width="16" height="16" fill="#FFFFFF" stroke="none" rx="3" />
    <rect x="150" y="260" width="16" height="16" fill="#FFFFFF" stroke="none" rx="3" />
  </g>
</svg>
